[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonectl"
version = "0.1.0"
description = "Windows Android phone mirroring, control and automation (built on scrcpy protocol)"
requires-python = ">=3.11"
dependencies = [
    "av>=12",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
phonectl = "phonectl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
